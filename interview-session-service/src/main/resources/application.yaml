server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: interview-session-service
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 32MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/interview_session_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/interviewos}

judge0:
  url: ${JUDGE0_URL:http://judge0:2358}
  auth-token: ${JUDGE0_AUTH_TOKEN:}
  wait-timeout-seconds: 20

runner:
  maven:
    image: ${RUNNER_MAVEN_IMAGE:ai-interview-os/lld-runner:latest}
    timeout-seconds: ${RUNNER_MAVEN_TIMEOUT_SECONDS:240}

storage:
  retention-days: ${STORAGE_RETENTION_DAYS:14}
  cleanup-cron: ${STORAGE_CLEANUP_CRON:0 0 3 * * ?}

vault:
  root: ${VAULT_ROOT:D:/AI OS Interview Media}
  sweep-cron: ${VAULT_SWEEP_CRON:0 30 3 * * ?}
  sweep-dry-run: ${VAULT_SWEEP_DRY_RUN:false}

ai:
  orchestrator:
    url: ${AI_ORCHESTRATOR_URL:http://ai-orchestrator-service:8082}

proctor:
  sentinel:
    url: ${PROCTOR_SENTINEL_URL:http://proctor-sentinel-service:8083}

question:
  bank:
    url: ${QUESTION_BANK_URL:http://question-bank-service:8086}

evaluation:
  report:
    url: ${EVALUATION_REPORT_URL:http://evaluation-report-service:8084}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always