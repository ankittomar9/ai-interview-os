server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: interview-session-service
  cloud:
    config:
      enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/interview_session_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/interviewos}

judge0:
  url: ${JUDGE0_URL:http://judge0:2358}
  auth-token: ${JUDGE0_AUTH_TOKEN:}
  wait-timeout-seconds: 20

runner:
  maven:
    image: ${RUNNER_MAVEN_IMAGE:ai-interview-os/lld-runner:latest}
    timeout-seconds: ${RUNNER_MAVEN_TIMEOUT_SECONDS:240}

storage:
  retention-days: ${STORAGE_RETENTION_DAYS:14}
  cleanup-cron: ${STORAGE_CLEANUP_CRON:0 0 3 * * ?}

ai:
  orchestrator:
    url: ${AI_ORCHESTRATOR_URL:http://ai-orchestrator-service:8082}

proctor:
  sentinel:
    url: ${PROCTOR_SENTINEL_URL:http://proctor-sentinel-service:8083}

question:
  bank:
    url: ${QUESTION_BANK_URL:http://question-bank-service:8086}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always