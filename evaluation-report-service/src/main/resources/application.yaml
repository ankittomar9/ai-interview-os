server:
  port: 8084

spring:
  application:
    name: evaluation-report-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:reportdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

# Inter-service URLs for OpenFeign
services:
  session-service:
    url: http://localhost:8081
  ai-orchestrator-service:
    url: http://localhost:8082
  proctor-sentinel-service:
    url: http://localhost:8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
