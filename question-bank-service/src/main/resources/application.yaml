server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: question-bank-service
  cloud:
    config:
      enabled: false
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/questionbank}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

gemini:
  api:
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models/}

groq:
  api:
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    fallback-models: ${GROQ_FALLBACK_MODELS:openai/gpt-oss-20b,qwen/qwen3.8-27b}

openai:
  api:
    model: ${OPENAI_MODEL:gpt-4o-mini}
