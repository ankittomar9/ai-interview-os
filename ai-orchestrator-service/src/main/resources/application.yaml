server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ai-orchestrator-service
  cloud:
    config:
      enabled: false

ai:
  providers:
    gemini:
      endpoint: "https://generativelanguage.googleapis.com/v1beta/models/"
      default-model: "gemini-2.0-flash"
      api-key: ${GEMINI_API_KEY:}
    groq:
      endpoint: "https://api.groq.com/openai/v1/chat/completions"
      default-model: ${GROQ_MODEL_DIALOGUE:openai/gpt-oss-120b}
      model-dialogue: ${GROQ_MODEL_DIALOGUE:openai/gpt-oss-120b}
      model-fast: ${GROQ_MODEL_FAST:openai/gpt-oss-20b}
      model-eval: ${GROQ_MODEL_EVAL:qwen/qwen3.8-27b}
      model-stt: ${GROQ_MODEL_STT:whisper-large-v3-turbo}
      rubric-model: ${GROQ_MODEL_EVAL:qwen/qwen3.8-27b}
      api-key: ${GROQ_API_KEY:}
    ollama:
      endpoint: ${OLLAMA_ENDPOINT:http://host.docker.internal:11434/api/generate}
      default-model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
    openai:
      endpoint: ${OPENAI_BASE_URL:https://api.openai.com/v1/chat/completions}
      default-model: ${OPENAI_MODEL_DIALOGUE:gpt-4o}
      model-dialogue: ${OPENAI_MODEL_DIALOGUE:gpt-4o}
      model-fast: ${OPENAI_MODEL_FAST:gpt-4o-mini}
      model-eval: ${OPENAI_MODEL_EVAL:gpt-4o}
      rubric-model: ${OPENAI_MODEL_EVAL:gpt-4o}
      api-key: ${OPENAI_API_KEY:}
  rubric:
    timeout-seconds: ${RUBRIC_TIMEOUT_SECONDS:25}
    allow-cloud-fallback: ${AI_RUBRIC_ALLOW_CLOUD_FALLBACK:${RUBRIC_ALLOW_CLOUD_FALLBACK:true}}

rubric:
  provider: ${RUBRIC_PROVIDER:ollama}
  api-key: ${RUBRIC_API_KEY:}
  timeout-seconds: ${RUBRIC_TIMEOUT_SECONDS:25}
  allow-cloud-fallback: ${AI_RUBRIC_ALLOW_CLOUD_FALLBACK:${RUBRIC_ALLOW_CLOUD_FALLBACK:true}}

question:
  bank:
    url: ${QUESTION_BANK_URL:http://question-bank-service:8086}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
