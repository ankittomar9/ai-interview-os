global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'api-gateway-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway-service:8080']
        labels:
          application: 'api-gateway-service'

  - job_name: 'interview-session-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['interview-session-service:8081']
        labels:
          application: 'interview-session-service'

  - job_name: 'ai-orchestrator-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ai-orchestrator-service:8082']
        labels:
          application: 'ai-orchestrator-service'

  - job_name: 'proctor-sentinel-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['proctor-sentinel-service:8083']
        labels:
          application: 'proctor-sentinel-service'

  - job_name: 'evaluation-report-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['evaluation-report-service:8084']
        labels:
          application: 'evaluation-report-service'

  - job_name: 'question-bank-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['question-bank-service:8086']
        labels:
          application: 'question-bank-service'
