server:
  port: 8888

spring:
  application:
    name: cloud-config-server
  profiles:
    active: native
  config:
    import: ""
  cloud:
    config:
      enabled: false
      server:
        bootstrap: false
        native:
          search-locations: classpath:/config-repo

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,busrefresh,metrics,prometheus