server:
  port: 8086

spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/questionbank}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

gemini:
  api:
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models/}

groq:
  api:
    model: ${GROQ_MODEL:qwen/qwen3-32b}
    fallback-models: ${GROQ_FALLBACK_MODELS:llama-3.1-8b-instant}

openai:
  api:
    model: ${OPENAI_MODEL:gpt-4o-mini}
