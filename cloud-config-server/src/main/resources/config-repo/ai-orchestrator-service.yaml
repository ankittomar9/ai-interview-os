server:
  port: 8082

ai:
  providers:
    gemini:
      endpoint: "https://generativelanguage.googleapis.com/v1beta/models/"
      default-model: "gemini-2.0-flash"
      api-key: ${GEMINI_API_KEY:}
    groq:
      endpoint: "https://api.groq.com/openai/v1/chat/completions"
      default-model: "llama-3.3-70b-versatile"
      api-key: ${GROQ_API_KEY:}
    ollama:
      endpoint: ${OLLAMA_ENDPOINT:http://host.docker.internal:11434/api/generate}
      default-model: ${OLLAMA_MODEL:qwen2.5-coder:7b}

rubric:
  provider: ${RUBRIC_PROVIDER:ollama}
  api-key: ${RUBRIC_API_KEY:}
  timeout-seconds: 60

question:
  bank:
    url: ${QUESTION_BANK_URL:http://question-bank-service:8086}