server:
  port: 8080

spring:
  application:
    name: api-gateway-service
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      httpclient:
        connect-timeout: 10000
        response-timeout: 360s
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "${FRONTEND_ORIGIN:http://localhost:5173}"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: true
      routes:
        # Route 1: Session Service (:8081)
        - id: session-service-route
          uri: ${SESSION_SERVICE_URL:http://interview-session-service:8081}
          predicates:
            - Path=/api/v1/sessions/**

        # Route 1.1: Problem Catalog (:8081)
        - id: problem-catalog-route
          uri: ${SESSION_SERVICE_URL:http://interview-session-service:8081}
          predicates:
            - Path=/api/v1/problems/**

        # Route 2: AI Orchestrator Service (:8082)
        - id: ai-orchestrator-route
          uri: ${AI_ORCHESTRATOR_URL:http://ai-orchestrator-service:8082}
          predicates:
            - Path=/api/v1/ai/**

        # Route 3: Proctor Sentinel Service (:8083)
        - id: proctor-sentinel-route
          uri: ${PROCTOR_SENTINEL_URL:http://proctor-sentinel-service:8083}
          predicates:
            - Path=/api/v1/proctor/**

        # Route 4: Evaluation Report Service (:8084)
        - id: evaluation-report-route
          uri: ${EVALUATION_REPORT_URL:http://evaluation-report-service:8084}
          predicates:
            - Path=/api/v1/reports/**

        # Route 5: Question Bank Service (:8086)
        - id: question-bank-route
          uri: ${QUESTION_BANK_URL:http://question-bank-service:8086}
          predicates:
            - Path=/api/v1/questions/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus