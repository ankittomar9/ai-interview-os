networks:
  ai-interview-net:
    name: ai-interview-net
    driver: bridge

services:
  # 0. PostgreSQL 16 Relational Store (Sessions, Telemetry, Reports)
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - ai-interview-net
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 0.1 MongoDB Document Store (Resumes, Document Mirror, Transcripts, Problems)
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ai-interview-net
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 0.2 Judge0 Dedicated PostgreSQL 13 Database
  judge0-db:
    image: postgres:13-alpine
    container_name: judge0-db
    environment:
      - POSTGRES_USER=${JUDGE0_DB_USER:-judge0}
      - POSTGRES_PASSWORD=${JUDGE0_DB_PASSWORD:-judge0pass}
      - POSTGRES_DB=${JUDGE0_DB_NAME:-judge0}
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    networks:
      - ai-interview-net
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JUDGE0_DB_USER:-judge0}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 0.3 Redis for Judge0 Submission Queue
  judge0-redis:
    image: redis:7-alpine
    container_name: judge0-redis
    networks:
      - ai-interview-net
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 0.4 Judge0 CE Zero-Trust Code Sandbox API Server (Privilege Dropped, Internal Network Only)
  judge0:
    image: judge0/judge0:1.13.1
    container_name: judge0-server
    environment:
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-db
      - POSTGRES_SERVER=judge0-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${JUDGE0_DB_NAME:-judge0}
      - POSTGRES_USER=${JUDGE0_DB_USER:-judge0}
      - POSTGRES_PASSWORD=${JUDGE0_DB_PASSWORD:-judge0pass}
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-interview-net
    mem_limit: 768m

  # 0.5 Judge0 Sandbox Execution Workers (Privileged for cgroup isolate namespace creation)
  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: judge0-workers
    command: ["./scripts/workers"]
    privileged: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-db
      - POSTGRES_SERVER=judge0-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${JUDGE0_DB_NAME:-judge0}
      - POSTGRES_USER=${JUDGE0_DB_USER:-judge0}
      - POSTGRES_PASSWORD=${JUDGE0_DB_PASSWORD:-judge0pass}
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-interview-net
    mem_limit: 512m

  # 0.6 Docker Socket Proxy (Fine-grained permission proxy for M9/M11 Docker container lifecycle)
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    environment:
      - CONTAINERS=1
      - VOLUMES=1
      - IMAGES=1
      - EXEC=1
      - POST=1
      - GET=1
      - PUT=1
      - DELETE=1
      - INFO=1
      - VERSION=1
      - PING=1
      - EVENTS=1
      - NETWORKS=1
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - NODES=0
      - PLUGINS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - SECRETS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ai-interview-net
    mem_limit: 64m
    restart: unless-stopped

  # 0.7 Pre-warmed LLD Maven Runner Image Builder
  lld-runner-build:
    build:
      context: ./docker/lld-runner
      dockerfile: Dockerfile
    image: ai-interview-os/lld-runner:latest
    entrypoint: ["true"]
    profiles: ["engines"]

  # 0.8 Embedded VS Code (code-server) Image Builder for M9 Workspace
  workspace-build:
    build:
      context: ./docker/workspace
      dockerfile: Dockerfile
    image: ai-interview-os/workspace:latest
    entrypoint: ["true"]
    profiles: ["engines"]

  # NOTE (ADR-004 / SPEC-002): Standalone service-discovery-service (:8761) and
  # cloud-config-server (:8888) have been retired in favor of Docker internal DNS
  # (ai-interview-net bridge) and profile inlining, reducing host RAM by ~750MB.

  # 3. Interview Session Service (Protected via Gateway & Socket Proxy)
  interview-session-service:
    build:
      context: .
      dockerfile: ./interview-session-service/Dockerfile
    container_name: interview-session-service
    networks:
      - ai-interview-net
    mem_limit: 512m
    environment:
      - SERVER_PORT=8081
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:+UseSerialGC
      - EUREKA_ENABLED=false
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/interview_session_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/interviewos
      - JUDGE0_URL=http://judge0:2358
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - WORKSPACE_NETWORK=ai-interview-net
      - WORKSPACE_HOST=localhost
      - RUNNER_MAVEN_IMAGE=ai-interview-os/lld-runner:latest
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started

  # 4. AI Orchestrator Service (Connected to Host Ollama & Groq Whisper)
  ai-orchestrator-service:
    build:
      context: .
      dockerfile: ./ai-orchestrator-service/Dockerfile
    container_name: ai-orchestrator-service
    networks:
      - ai-interview-net
    mem_limit: 512m
    environment:
      - SERVER_PORT=8082
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:+UseSerialGC
      - EUREKA_ENABLED=false
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434/api/generate
      - OLLAMA_MODEL=qwen2.5-coder:7b
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL_DIALOGUE=${GROQ_MODEL_DIALOGUE:-openai/gpt-oss-120b}
      - GROQ_MODEL_FAST=${GROQ_MODEL_FAST:-openai/gpt-oss-20b}
      - GROQ_MODEL_EVAL=${GROQ_MODEL_EVAL:-qwen/qwen3.8-27b}
      - GROQ_MODEL_STT=${GROQ_MODEL_STT:-whisper-large-v3-turbo}
      - WHISPER_ENDPOINT=${WHISPER_ENDPOINT:-http://whisper-sidecar:8178/inference}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 4.5 Local Whisper.cpp Speech-to-Text Sidecar (SPEC-003, profile: local-stt)
  whisper-sidecar:
    build:
      context: ./whisper-sidecar
      dockerfile: Dockerfile
    container_name: whisper-sidecar
    networks:
      - ai-interview-net
    ports:
      - "8178:8178"
    mem_limit: 512m
    profiles: ["local-stt", "engines"]
    restart: unless-stopped

  # 5. Proctor Sentinel Service (Connected to PostgreSQL)
  proctor-sentinel-service:
    build:
      context: .
      dockerfile: ./proctor-sentinel-service/Dockerfile
    container_name: proctor-sentinel-service
    networks:
      - ai-interview-net
    mem_limit: 384m
    environment:
      - SERVER_PORT=8083
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:+UseSerialGC
      - EUREKA_ENABLED=false
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/proctor_sentinel_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  # 6. Evaluation Report Service (Connected to PostgreSQL)
  evaluation-report-service:
    build:
      context: .
      dockerfile: ./evaluation-report-service/Dockerfile
    container_name: evaluation-report-service
    networks:
      - ai-interview-net
    mem_limit: 512m
    environment:
      - SERVER_PORT=8084
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:+UseSerialGC
      - EUREKA_ENABLED=false
      - SESSION_SERVICE_URL=http://interview-session-service:8081
      - PROCTOR_SERVICE_URL=http://proctor-sentinel-service:8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/evaluation_report_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  # 6.5 Question Bank Service (Connected to MongoDB & Direct DNS)
  question-bank-service:
    build:
      context: .
      dockerfile: ./question-bank-service/Dockerfile
    container_name: question-bank-service
    networks:
      - ai-interview-net
    mem_limit: 384m
    environment:
      - SERVER_PORT=8086
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:+UseSerialGC
      - EUREKA_ENABLED=false
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/questionbank
    depends_on:
      mongodb:
        condition: service_healthy

  # 7. Spring Cloud API Gateway (Public Ingress Entrypoint :8080 with Docker DNS)
  api-gateway-service:
    build:
      context: .
      dockerfile: ./api-gateway-service/Dockerfile
    container_name: api-gateway-service
    ports:
      - "8080:8080"
    networks:
      - ai-interview-net
    mem_limit: 256m
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:+UseSerialGC
      - EUREKA_ENABLED=false
      - SESSION_SERVICE_URL=http://interview-session-service:8081
      - AI_ORCHESTRATOR_URL=http://ai-orchestrator-service:8082
      - PROCTOR_SENTINEL_URL=http://proctor-sentinel-service:8083
      - EVALUATION_REPORT_URL=http://evaluation-report-service:8084
      - QUESTION_BANK_URL=http://question-bank-service:8086
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:5173}

  # 8. Frontend React Cockpit (:5173)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-cockpit
    ports:
      - "5173:80"
    networks:
      - ai-interview-net
    mem_limit: 128m
    depends_on:
      - api-gateway-service

volumes:
  mongodb_data:
  postgres_data:
  judge0_db_data: