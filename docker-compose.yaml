networks:
  ai-interview-net:
    name: ai-interview-net
    driver: bridge

services:
  # 0. PostgreSQL 16 Relational Store (Sessions, Telemetry, Reports)
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - ai-interview-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 0.1 MongoDB Document Store (Resumes, Document Mirror, Transcripts)
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ai-interview-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 1. Eureka Service Discovery
  service-discovery-service:
    build:
      context: .
      dockerfile: ./service-discovery-service/Dockerfile
    container_name: service-discovery-service
    ports:
      - "8761:8761"
    networks:
      - ai-interview-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # 2. Centralized Config Server
  cloud-config-server:
    build:
      context: .
      dockerfile: ./cloud-config-server/Dockerfile
    container_name: cloud-config-server
    ports:
      - "8888:8888"
    networks:
      - ai-interview-net
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    depends_on:
      service-discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # 3. Interview Session Service (Connected to PostgreSQL & MongoDB)
  interview-session-service:
    build:
      context: .
      dockerfile: ./interview-session-service/Dockerfile
    container_name: interview-session-service
    ports:
      - "8081:8081"
    networks:
      - ai-interview-net
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloud-config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/interview_session_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/interviewos
    depends_on:
      cloud-config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  # 4. AI Orchestrator Service (Connected to Host Ollama & Groq Whisper)
  ai-orchestrator-service:
    build:
      context: .
      dockerfile: ./ai-orchestrator-service/Dockerfile
    container_name: ai-orchestrator-service
    ports:
      - "8082:8082"
    networks:
      - ai-interview-net
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloud-config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434/api/generate
      - OLLAMA_MODEL=qwen2.5-coder:7b
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      cloud-config-server:
        condition: service_healthy

  # 5. Proctor Sentinel Service (Connected to PostgreSQL)
  proctor-sentinel-service:
    build:
      context: .
      dockerfile: ./proctor-sentinel-service/Dockerfile
    container_name: proctor-sentinel-service
    ports:
      - "8083:8083"
    networks:
      - ai-interview-net
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloud-config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/proctor_sentinel_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      cloud-config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # 6. Evaluation Report Service (Connected to PostgreSQL)
  evaluation-report-service:
    build:
      context: .
      dockerfile: ./evaluation-report-service/Dockerfile
    container_name: evaluation-report-service
    ports:
      - "8084:8084"
    networks:
      - ai-interview-net
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloud-config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/evaluation_report_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      cloud-config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # 7. Spring Cloud API Gateway
  api-gateway-service:
    build:
      context: .
      dockerfile: ./api-gateway-service/Dockerfile
    container_name: api-gateway-service
    ports:
      - "8080:8080"
    networks:
      - ai-interview-net
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    depends_on:
      service-discovery-service:
        condition: service_healthy

  # 8. Frontend React Cockpit
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-cockpit
    ports:
      - "5173:80"
    networks:
      - ai-interview-net
    depends_on:
      - api-gateway-service

volumes:
  mongodb_data:
  postgres_data: